name: Build and Release OutlookOkan

on:
  push:
    branches: [ master ]
    paths:
      - 'OutlookOkan/**'
      - '.github/workflows/**'
  pull_request:
    branches: [ master ]
  workflow_dispatch:
    inputs:
      custom_tag:
        description: 'Custom tag (leave empty = auto bump)'
        required: false
        default: ''
      custom_description:
        description: 'Custom description (leave empty = auto from commits)'
        required: false
        default: ''

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # ============================================================
  # JOB 1: VERSION
  # Detect auto/manual mode, bump tag, generate changelog
  # ============================================================
  version:
    name: "1 Version"
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.final.outputs.version }}
      previous_tag: ${{ steps.auto.outputs.previous_tag }}
      changelog: ${{ steps.final.outputs.changelog }}

    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Detect Mode (Auto vs Manual)
      id: check
      run: |
        CUSTOM_TAG="${{ github.event.inputs.custom_tag }}"
        if [ -n "$CUSTOM_TAG" ]; then
          echo "is_manual=true" >> $GITHUB_OUTPUT
          echo "### Mode: MANUAL tag=$CUSTOM_TAG" >> $GITHUB_STEP_SUMMARY
        else
          echo "is_manual=false" >> $GITHUB_OUTPUT
          echo "### Mode: AUTO (patch bump)" >> $GITHUB_STEP_SUMMARY
        fi

    - name: Auto Bump Tag
      id: auto
      if: steps.check.outputs.is_manual != 'true'
      uses: anothrNick/github-tag-action@1.71.0
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        WITH_V: true
        DEFAULT_BUMP: patch
        RELEASE_BRANCHES: master
        DRY_RUN: false
        INITIAL_VERSION: 1.0.0

    - name: Auto Generate Changelog
      id: auto_changelog
      if: steps.check.outputs.is_manual != 'true'
      run: |
        PREV="${{ steps.auto.outputs.previous_tag }}"
        if [ -z "$PREV" ]; then
          COMMITS=$(git log --pretty=format:"- %s (%h)" -n 50)
        else
          COMMITS=$(git log --pretty=format:"- %s (%h)" ${PREV}..HEAD)
        fi
        FEATURES=$(echo "$COMMITS" | grep -iE "^- (feat|feature|add|new):" || true)
        FIXES=$(echo "$COMMITS" | grep -iE "^- (fix|bug|patch|resolve):" || true)
        IMPR=$(echo "$COMMITS" | grep -iE "^- (refactor|perf|improve|update|enhance):" || true)
        OTHER=$(echo "$COMMITS" | grep -ivE "^- (feat|feature|add|new|fix|bug|patch|resolve|refactor|perf|improve|update|enhance):" || true)
        LOG=""
        [ -n "$FEATURES" ] && LOG="${LOG}### New Features\n${FEATURES}\n\n"
        [ -n "$FIXES" ] && LOG="${LOG}### Bug Fixes\n${FIXES}\n\n"
        [ -n "$IMPR" ] && LOG="${LOG}### Improvements\n${IMPR}\n\n"
        [ -n "$OTHER" ] && LOG="${LOG}### Other\n${OTHER}\n\n"
        [ -z "$LOG" ] && LOG="### Changes\n${COMMITS}\n"
        echo "changelog<<EOF" >> $GITHUB_OUTPUT
        echo -e "$LOG" >> $GITHUB_OUTPUT
        echo "EOF" >> $GITHUB_OUTPUT

    - name: Create Manual Tag
      if: steps.check.outputs.is_manual == 'true'
      run: |
        TAG="${{ github.event.inputs.custom_tag }}"
        [[ ! "$TAG" =~ ^v ]] && TAG="v${TAG}"
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        git tag -a "$TAG" -m "Release $TAG"
        git push origin "$TAG"

    - name: Set Final Outputs
      id: final
      run: |
        IS_MANUAL="${{ steps.check.outputs.is_manual }}"
        if [ "$IS_MANUAL" == "true" ]; then
          TAG="${{ github.event.inputs.custom_tag }}"
          [[ ! "$TAG" =~ ^v ]] && TAG="v${TAG}"
          echo "version=${TAG}" >> $GITHUB_OUTPUT
          DESC="${{ github.event.inputs.custom_description }}"
          if [ -n "$DESC" ]; then
            echo "changelog<<EOF" >> $GITHUB_OUTPUT
            echo "$DESC" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
          else
            echo "changelog=Manual release" >> $GITHUB_OUTPUT
          fi
        else
          echo "version=${{ steps.auto.outputs.new_tag }}" >> $GITHUB_OUTPUT
          echo "changelog<<EOF" >> $GITHUB_OUTPUT
          echo "${{ steps.auto_changelog.outputs.changelog }}" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT
        fi
        echo "### Version: ${{ steps.final.outputs.version }}" >> $GITHUB_STEP_SUMMARY


  # ============================================================
  # JOB 2: PREPARE
  # Restore packages, stamp version, validate/regenerate PFX
  # Output: prepared source tree as artifact
  # ============================================================
  prepare:
    name: "2 Prepare"
    runs-on: windows-latest
    needs: version
    env:
      PFX_PATH: ${{ github.workspace }}\OutlookOkan\OutlookOkan_CI.pfx

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Setup NuGet
      uses: NuGet/setup-nuget@v2

    - name: Restore NuGet Packages
      shell: pwsh
      run: nuget restore OutlookOkan.sln

    - name: Stamp Assembly Version
      shell: pwsh
      run: |
        $version = "${{ needs.version.outputs.version }}".TrimStart('v')
        $parts = $version -split '\.'
        $asmVer = if ($parts.Count -ge 3) { "$($parts[0]).$($parts[1]).$($parts[2]).0" } else { "1.0.0.0" }
        $path = "OutlookOkan\Properties\AssemblyInfo.cs"
        if (Test-Path $path) {
          $c = Get-Content $path -Raw
          $c = $c -replace 'AssemblyVersion\("[^"]*"\)', "AssemblyVersion(`"$asmVer`")"
          $c = $c -replace 'AssemblyFileVersion\("[^"]*"\)', "AssemblyFileVersion(`"$asmVer`")"
          Set-Content $path $c
          Write-Host "Stamped: $asmVer"
        } else { Write-Warning "AssemblyInfo.cs not found" }

    - name: Validate or Regenerate CI Certificate
      shell: pwsh
      run: |
        $pfx = "$env:PFX_PATH"
        $pwd = ConvertTo-SecureString "123456" -AsPlainText -Force
        $valid = $false
        if (Test-Path $pfx) {
          try {
            $cert = New-Object System.Security.Cryptography.X509Certificates.X509Certificate2($pfx, "123456")
            if ($cert.NotAfter -gt (Get-Date)) {
              $valid = $true
              Write-Host "PFX OK, expires: $($cert.NotAfter)"
            } else { Write-Warning "PFX expired ($($cert.NotAfter))" }
          } catch { Write-Warning "PFX invalid: $($_.Exception.Message)" }
        } else { Write-Host "PFX not found" }

        if (-not $valid) {
          Write-Host "Generating new self-signed certificate..."
          $newCert = New-SelfSignedCertificate `
            -Subject "CN=OutlookOkan_CI" `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -Type CodeSigningCert
          Export-PfxCertificate -Cert $newCert -FilePath $pfx -Password $pwd | Out-Null
          Write-Host "New PFX generated: $pfx"
        }

    - name: Upload Prepared Source
      uses: actions/upload-artifact@v4
      with:
        name: prepared-source
        path: |
          OutlookOkan/**
          OutlookOkanTest/**
          SetupCustomAction/**
          OutlookOkan.sln
          packages/**
        retention-days: 1


  # ============================================================
  # JOB 3: COMPILE
  # Install VSTO Runtime, import CI cert, MSBuild Publish ClickOnce
  # Produces: setup.exe, OutlookOkan.vsto, Application Files/
  # ============================================================
  compile:
    name: "3 Compile"
    runs-on: windows-latest
    needs: [version, prepare]
    env:
      CSPROJ_PATH: ${{ github.workspace }}\OutlookOkan\OutlookOkan.csproj
      PFX_PATH: ${{ github.workspace }}\OutlookOkan\OutlookOkan_CI.pfx
      PUBLISH_DIR: ${{ github.workspace }}\OutlookOkan\app.publish
      MSBUILD_LOG: ${{ github.workspace }}\msbuild.log

    steps:
    - name: Download Prepared Source
      uses: actions/download-artifact@v4
      with:
        name: prepared-source
        path: ${{ github.workspace }}

    - name: Setup MSBuild
      uses: microsoft/setup-msbuild@v2

    - name: Install VSTO Runtime
      shell: pwsh
      # Official Microsoft Visual Studio 2010 Tools for Office Runtime installer.
      # Installs all VSTO runtime assemblies (Office.Runtime, Hosting, ServerDocument, etc.)
      # to the GAC, resolving MSB4018 / FileNotFoundException for RegisterFormRegions and ClickOnce tasks.
      run: |
        $vstorUrl = "https://download.microsoft.com/download/5/d/2/5d24f8f8-efbb-4b63-aa33-3785e3104713/vstor_redist.exe"
        $installer = "$env:TEMP\vstor_redist.exe"
        Write-Host "Downloading Visual Studio 2010 Tools for Office Runtime (VSTO Runtime)..."
        $retries = 3
        for ($i = 1; $i -le $retries; $i++) {
          try {
            Invoke-WebRequest -Uri $vstorUrl -OutFile $installer -UseBasicParsing
            if ((Test-Path $installer) -and (Get-Item $installer).Length -gt 10000000) {
              Write-Host "Download OK: $((Get-Item $installer).Length) bytes"
              break
            }
          } catch {
            Write-Warning "Download attempt $i failed: $($_.Exception.Message)"
            if ($i -eq $retries) { throw }
            Start-Sleep -Seconds 3
          }
        }
        Write-Host "Installing VSTO Runtime silently..."
        $proc = Start-Process -FilePath $installer -ArgumentList "/q /norestart" -Wait -PassThru
        Write-Host "VSTO Runtime installer exit code: $($proc.ExitCode)"
        if ($proc.ExitCode -ne 0 -and $proc.ExitCode -ne 3010) {
          Write-Error "VSTO Runtime installation failed with code $($proc.ExitCode)"
          exit 1
        }
        Write-Host "VSTO Runtime installed successfully."

    - name: Import Certificate to Windows Certificate Store
      shell: pwsh
      run: |
        $pfx = "$env:PFX_PATH"
        $pwd = ConvertTo-SecureString "123456" -AsPlainText -Force
        if (-not (Test-Path $pfx)) {
          Write-Error "PFX not found at: $pfx"
          exit 1
        }
        $certObj = Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\CurrentUser\My" -Password $pwd
        Write-Host "Imported to CurrentUser\My. Thumbprint: $($certObj.Thumbprint)"
        try {
          Import-PfxCertificate -FilePath $pfx -CertStoreLocation "Cert:\LocalMachine\Root" -Password $pwd | Out-Null
          Write-Host "Imported to LocalMachine\Root."
        } catch {
          Write-Warning "LocalMachine\Root import skipped (optional): $($_.Exception.Message)"
        }
        "CERT_THUMBPRINT=$($certObj.Thumbprint)" | Out-File -FilePath $env:GITHUB_ENV -Encoding utf8 -Append

    - name: MSBuild Publish
      shell: pwsh
      # Publishes ClickOnce installer: generates setup.exe, OutlookOkan.vsto, and Application Files
      # SignManifests=true is REQUIRED by VSTO OfficeTools.targets
      run: |
        Write-Host "Project:    $env:CSPROJ_PATH"
        Write-Host "PublishDir: $env:PUBLISH_DIR"
        Write-Host "Thumbprint: $env:CERT_THUMBPRINT"
        msbuild "$env:CSPROJ_PATH" `
          /t:Publish `
          /p:Configuration=Release `
          /p:Platform=AnyCPU `
          /p:SignManifests=true `
          /p:ManifestKeyFile="OutlookOkan_CI.pfx" `
          /p:ManifestCertificateThumbprint="$env:CERT_THUMBPRINT" `
          /p:PublishDir="$env:PUBLISH_DIR\" `
          /p:ManifestTimestampUrl="" `
          /fl "/flp:logfile=$env:MSBUILD_LOG;verbosity=normal"

    - name: Verify Build Output
      shell: pwsh
      run: |
        $dir = "$env:PUBLISH_DIR"
        if (-not (Test-Path $dir)) {
          Write-Error "Publish dir not found: $dir"
          exit 1
        }
        $setup = Join-Path $dir "setup.exe"
        $vsto = Join-Path $dir "OutlookOkan.vsto"
        if (-not (Test-Path $setup)) {
          Write-Error "setup.exe missing in $dir"
          exit 1
        }
        if (-not (Test-Path $vsto)) {
          Write-Error "OutlookOkan.vsto missing in $dir"
          exit 1
        }
        $files = Get-ChildItem -Path $dir -Recurse
        Write-Host "Publish OK - $($files.Count) files in $dir"
        $files | Select-Object Name | Format-Table -AutoSize

    - name: Upload Build Output
      uses: actions/upload-artifact@v4
      with:
        name: build-output-${{ needs.version.outputs.version }}
        path: ${{ env.PUBLISH_DIR }}\**
        if-no-files-found: error
        retention-days: 7

    - name: Upload Build Log (always)
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: build-log
        path: ${{ env.MSBUILD_LOG }}
        if-no-files-found: ignore
        retention-days: 7


  # ============================================================
  # JOB 4: PACKAGE
  # Verify output, create installer ZIP + SHA256 checksum
  # ============================================================
  package:
    name: "4 Package"
    runs-on: ubuntu-latest
    needs: [version, compile]

    steps:
    - name: Download Build Output
      uses: actions/download-artifact@v4
      with:
        name: build-output-${{ needs.version.outputs.version }}
        path: installer

    - name: Verify Installer Files
      run: |
        if [ -z "$(ls -A installer)" ]; then
          echo "ERROR: installer directory is empty!" && exit 1
        fi
        echo "Installer files ($(find installer -type f | wc -l) total):"
        ls -la installer/
        [ -f "installer/setup.exe" ] || (echo "ERROR: setup.exe missing from package!" && exit 1)
        [ -f "installer/OutlookOkan.vsto" ] || (echo "ERROR: OutlookOkan.vsto missing from package!" && exit 1)
        echo "Installer files verification passed."

    - name: Create ZIP and SHA256 Checksum
      run: |
        VERSION="${{ needs.version.outputs.version }}"
        ZIP="OutlookOkan_${VERSION}_Installer.zip"
        cd installer && zip -r ../${ZIP} . && cd ..
        sha256sum ${ZIP} > CHECKSUMS.sha256
        echo "Created: ${ZIP} ($(du -sh ${ZIP} | cut -f1))"
        cat CHECKSUMS.sha256

    - name: Upload Installer Artifact
      uses: actions/upload-artifact@v4
      with:
        name: installer-${{ needs.version.outputs.version }}
        path: |
          OutlookOkan_${{ needs.version.outputs.version }}_Installer.zip
          CHECKSUMS.sha256
        if-no-files-found: error
        retention-days: 30


  # ============================================================
  # JOB 5: RELEASE
  # Publish GitHub Release (only on push to master, not PRs)
  # ============================================================
  release:
    name: "5 Release"
    runs-on: ubuntu-latest
    needs: [version, package]
    if: github.event_name != 'pull_request'
    permissions:
      contents: write

    steps:
    - name: Download Installer Artifact
      uses: actions/download-artifact@v4
      with:
        name: installer-${{ needs.version.outputs.version }}

    - name: Verify Release Files
      run: |
        ls -la
        [ -f "OutlookOkan_${{ needs.version.outputs.version }}_Installer.zip" ] || (echo "ZIP not found!" && exit 1)
        [ -f "CHECKSUMS.sha256" ] || (echo "Checksum not found!" && exit 1)

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ needs.version.outputs.version }}
        name: OutlookOkan ${{ needs.version.outputs.version }}
        body: |
          ## What Changed

          ${{ needs.version.outputs.changelog }}

          ---

          ## Installation

          1. Download `OutlookOkan_${{ needs.version.outputs.version }}_Installer.zip`
          2. Extract and run `setup.exe`
          3. Restart Microsoft Outlook

          ---

          **Compare:** [${{ needs.version.outputs.previous_tag }}...${{ needs.version.outputs.version }}](https://github.com/${{ github.repository }}/compare/${{ needs.version.outputs.previous_tag }}...${{ needs.version.outputs.version }})
        files: |
          OutlookOkan_${{ needs.version.outputs.version }}_Installer.zip
          CHECKSUMS.sha256
        draft: false
        prerelease: false

    - name: Release Summary
      run: |
        echo "### Released: ${{ needs.version.outputs.version }}" >> $GITHUB_STEP_SUMMARY
        echo "[View Release](https://github.com/${{ github.repository }}/releases/tag/${{ needs.version.outputs.version }})" >> $GITHUB_STEP_SUMMARY
